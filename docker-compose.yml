services:
  nginx-proxy:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web-app-a:
        condition: service_healthy
      web-app-b:
        condition: service_healthy
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  web-app-a:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      SERVICE_NAME: "主服务 A"
      STOCK_WEB_HOST: "0.0.0.0"
      STOCK_WEB_USERNAME: "${STOCK_WEB_USERNAME:-admin}"
      STOCK_WEB_PASSWORD: "${STOCK_WEB_PASSWORD:-change-me}"
      STOCK_WEB_SECRET: "${STOCK_WEB_SECRET:-change-this-secret-before-deployment}"
      SOCKETIO_MESSAGE_QUEUE: "redis://redis:6379/0"
      STOCK_UPDATE_INTERVAL: "${STOCK_UPDATE_INTERVAL:-60}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-stock_viewer}"
      DB_USER: "${POSTGRES_USER:-stock_viewer}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-change-this-db-password}"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - stock-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web-app-b:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      SERVICE_NAME: "主服务 B"
      STOCK_WEB_HOST: "0.0.0.0"
      STOCK_WEB_USERNAME: "${STOCK_WEB_USERNAME:-admin}"
      STOCK_WEB_PASSWORD: "${STOCK_WEB_PASSWORD:-change-me}"
      STOCK_WEB_SECRET: "${STOCK_WEB_SECRET:-change-this-secret-before-deployment}"
      SOCKETIO_MESSAGE_QUEUE: "redis://redis:6379/0"
      STOCK_UPDATE_INTERVAL: "${STOCK_UPDATE_INTERVAL:-60}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-stock_viewer}"
      DB_USER: "${POSTGRES_USER:-stock_viewer}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-change-this-db-password}"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - stock-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-stock_viewer}"
      POSTGRES_USER: "${POSTGRES_USER:-stock_viewer}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-this-db-password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stock-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  stock-network:
    driver: bridge

volumes:
  postgres_data:
